<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment & Checkout | The Mandir Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fff6ea; margin: 0; padding: 0; }
    .page-content { background-color: #fff6ea; min-height: calc(100vh - 120px); padding: 60px 0; }
    h1, h2, h3, h4, h5, h6, p, label { color: #c4a092; }
    .checkout-card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .btn-confirm { background-color: #c4a092; color: white; font-weight: 600; border: none; font-size: 1.1rem; }
    .btn-confirm:hover { background-color: #b08b7d; color: white; }
    .info-box { background-color: #fffaf3; border: 1px solid #e0c8bf; border-radius: 6px; padding: 12px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">The Mandir Company</a>
  </div>
</nav>

<div class="page-content">
  <section class="container">
    <h1 class="text-center mb-4">Checkout & Order Placement</h1>

    <div class="row">
      <!-- ADDRESS FORM -->
      <div class="col-lg-7">
        <div class="checkout-card">
          <h4 class="fw-bold mb-4">📍 Shipping Address</h4>
          <form id="address-form">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Full Name *</label>
                <input type="text" class="form-control" id="fullName" required placeholder="Enter full name">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Phone Number *</label>
                <input type="tel" class="form-control" id="phone" required placeholder="Enter phone number">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Street Address *</label>
              <input type="text" class="form-control" id="address" required placeholder="Enter house no, street name">
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">City *</label>
                <input type="text" class="form-control" id="city" required placeholder="City">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">State *</label>
                <input type="text" class="form-control" id="state" required placeholder="State">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">Pincode *</label>
                <input type="text" class="form-control" id="pincode" required placeholder="Pincode">
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- SUMMARY & CONFIRM BUTTON -->
      <div class="col-lg-5">
        <div class="checkout-card text-center">
          <h4 class="fw-bold mb-3">💳 Order Summary</h4>
          <div class="d-flex justify-content-between px-3 my-1 text-muted fs-6">
            <span>Subtotal:</span>
            <span id="subtotal-display">₹0</span>
          </div>
          <div class="d-flex justify-content-between px-3 my-1 text-muted fs-6">
            <span>Shipping:</span>
            <span id="shipping-display">₹150</span>
          </div>
          <hr style="color: #c4a092;">

          <p class="mb-1 fw-bold">Total Amount Payable:</p>
          <h2 class="fw-bold mb-3" id="pay-total-val">₹0</h2>

          <div class="d-grid gap-2 my-3">
            <button class="btn btn-confirm py-3" onclick="processOrder()">
              Confirm Order 🛍️
            </button>
          </div>

          <div class="info-box text-start mt-3">
            <p class="small mb-0" style="color: #6c5248;">
              ℹ️ <strong>Next Steps:</strong> Once you confirm, your order is registered! Our team will reach out to you within <strong>48 hours</strong> to finalize your payment and shipping details.
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

const products = {
  1:{name:"German Silver Diya",price:"₹1,100"}, 2:{name:"Marble Flower Diya",price:"₹850"},
  3:{name:"Akhand Diya With Plate",price:"₹575"}, 4:{name:"German Silver Dibbi",price:"₹185"}
};
let grandTotal = 0;
const SHIPPING_FEE = 150;

document.addEventListener("DOMContentLoaded", () => {
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }
  calculateTotal();
});

function parsePrice(priceStr) { return parseInt(priceStr.replace(/[^0-9]/g, '')) || 0; }

function getCartData() {
  let raw = localStorage.getItem("cart");
  if (!raw) return {};
  try { return JSON.parse(raw); } catch(e) { return {}; }
}

function calculateTotal() {
  let cartObj = getCartData();
  let subtotalAmount = 0;
  Object.keys(cartObj).forEach(id => {
    if (products[id]) subtotalAmount += (parsePrice(products[id].price) * (cartObj[id] || 1));
  });
  grandTotal = subtotalAmount > 0 ? subtotalAmount + SHIPPING_FEE : 0;
  document.getElementById("subtotal-display").innerText = "₹" + subtotalAmount.toLocaleString('en-IN');
  document.getElementById("pay-total-val").innerText = "₹" + grandTotal.toLocaleString('en-IN');
}

function triggerDeviceNotification() {
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("The Mandir Company", {
      body: "Your order is placed! We will reach out within 48 hours for payment details.",
      icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
    });
  }
}

async function processOrder() {
  if (grandTotal <= 0) { alert("Your cart is empty."); return; }
  const form = document.getElementById("address-form");
  if (!form.checkValidity()) { form.reportValidity(); return; }

  let cartObj = getCartData();
  let itemSummary = [];
  Object.keys(cartObj).forEach(id => {
    if (products[id]) itemSummary.push(`${products[id].name} (Qty: ${cartObj[id]})`);
  });

  const orderPayload = {
    orderId: "TMC-" + Math.floor(100000 + Math.random() * 900000),
    date: new Date().toLocaleString("en-IN"),
    fullName: document.getElementById("fullName").value,
    phone: document.getElementById("phone").value,
    address: `${document.getElementById("address").value}, ${document.getElementById("city").value}, ${document.getElementById("state").value} - ${document.getElementById("pincode").value}`,
    items: itemSummary.join("; "),
    total: "₹" + grandTotal.toLocaleString('en-IN')
  };

  triggerDeviceNotification();
  sessionStorage.setItem("latestOrder", JSON.stringify(orderPayload));

  try {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderPayload)
    });
  } catch(e) { console.error(e); }

  localStorage.removeItem("cart");
  window.location.href = "confirmation.html";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Order Management | The Mandir Company</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body { background-color: #fff6ea; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    .page-content { background-color: #fff6ea; min-height: calc(100vh - 120px); padding: 40px 0; }
    h1, h2, h3, h4, h5, h6, p, label { color: #c4a092; }
    .order-card { background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); margin-bottom: 20px; border: 1px solid rgba(196,160,146,0.15); }
    .btn-refresh { background-color: #c4a092; color: #ffffff; border: none; font-weight: 600; border-radius: 8px; }
    .btn-refresh:hover { background-color: #b08b7d; color: #ffffff; }
    .table-orders { vertical-align: middle; }
    .table-orders th { color: #c4a092; background-color: #fffaf3; white-space: nowrap; }
    .form-control, .form-select { border-color: rgba(196,160,146,0.4); color: #80655c; }
    .form-control:focus, .form-select:focus { border-color: #c4a092; box-shadow: 0 0 0 0.25rem rgba(196,160,146,0.25); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html" style="color: #c4a092;">The Mandir Company</a>
      <span class="navbar-text text-muted fw-bold">Admin Dashboard</span>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      
      <!-- ADD NEW PRODUCT CARD -->
      <div class="order-card mb-4">
        <h4 class="fw-bold mb-3">➕ Add New Bestseller / Product</h4>
        <form id="addProductForm" onsubmit="handleProductUpload(event)">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Product Name</label>
              <input type="text" id="p-name" class="form-control" placeholder="e.g. Marble Diya Stand" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Price (e.g. ₹850)</label>
              <input type="text" id="p-price" class="form-control" placeholder="₹850" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Category</label>
              <select id="p-category" class="form-select">
                <option value="pooja">Pooja Essentials</option>
                <option value="decor">Home Décor</option>
                <option value="gifting">Gifting</option>
                <option value="guruji">Guruji Collection</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="p-desc" class="form-control" rows="2" placeholder="Handcrafted with antique finish..." required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Select Image from Device</label>
              <input type="file" id="p-image-file" class="form-control" accept="image/*" required>
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="submit" class="btn btn-refresh w-100 py-2" id="upload-btn">Upload & Publish Product 🚀</button>
            </div>
          </div>
        </form>
      </div>

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Customer Orders 📦</h2>
        <button class="btn btn-refresh px-4 py-2" onclick="fetchOrders()">🔄 Refresh Orders</button>
      </div>

      <!-- SUMMARY CARDS -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="order-card text-center py-3 h-100 m-0">
            <h6 class="text-muted mb-1">Total Orders</h6>
            <h3 class="fw-bold m-0" id="stat-total">0</h3>
          </div>
        </div>
        <div class="col-md-6">
          <div class="order-card text-center py-3 h-100 m-0">
            <h6 class="text-muted mb-1">Total Revenue</h6>
            <h3 class="fw-bold m-0" id="stat-revenue">₹0</h3>
          </div>
        </div>
      </div>

      <!-- ORDERS TABLE -->
      <div class="order-card p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover table-orders m-0">
            <thead>
              <tr>
                <th class="ps-4">Order ID</th>
                <th>Date & Time</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Items</th>
                <th>Total</th>
                <th class="pe-4 text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr>
                <td colspan="8" class="text-center py-5 text-muted">Loading orders from Google Sheets...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <footer class="text-center py-4 bg-light border-top">
    <p class="m-0" style="color: #c4a092;">&copy; 2026 The Mandir Company. All rights reserved.</p>
  </footer>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnJU4J23D0TRxGyUauR77R3wMNeEEwYB8KEaKhb6el5DPIH5-7x8Y7XwEBV2NRVwZV3g/exec";

    document.addEventListener("DOMContentLoaded", fetchOrders);

    async function fetchOrders() {
      const tableBody = document.getElementById("orders-table-body");
      tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-muted"><div class="spinner-border text-secondary mb-2"></div><div>Fetching latest orders...</div></td></tr>`;
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const orders = await response.json();
        if (!Array.isArray(orders) || orders.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-muted">No orders found yet.</td></tr>`;
          updateStats(0, 0);
          return;
        }
        renderTable(orders);
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">⚠️ Unable to fetch orders.</td></tr>`;
      }
    }

    async function handleProductUpload(event) {
      event.preventDefault();
      const btn = document.getElementById("upload-btn");
      btn.innerText = "Uploading image & publishing...";
      btn.disabled = true;

      const fileInput = document.getElementById("p-image-file").files[0];
      const formData = new FormData();
      formData.append("image", fileInput);

      try {
        const imgbbResponse = await fetch("https://api.imgbb.com/1/upload?key=6d207e05917863e46c98695bc352c85e", {
          method: "POST",
          body: formData
        });
        const imgData = await imgbbResponse.json();
        const publicImageUrl = imgData.data.url;

        const payload = new URLSearchParams({
          formType: "addProduct",
          name: document.getElementById("p-name").value,
          price: document.getElementById("p-price").value,
          category: document.getElementById("p-category").value,
          desc: document.getElementById("p-desc").value,
          imgUrl: publicImageUrl
        });

        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: payload
        });

        alert("Product published successfully! It is now live on the website.");
        document.getElementById("addProductForm").reset();
      } catch (error) {
        alert("Failed to publish product: " + error.message);
      } finally {
        btn.innerText = "Upload & Publish Product 🚀";
        btn.disabled = false;
      }
    }

    function parsePrice(price) {
      if (!price) return 0;
      return parseInt(String(price).replace(/[^0-9]/g, "")) || 0;
    }

    function updateStats(totalOrders, totalRevenue) {
      document.getElementById("stat-total").innerText = totalOrders;
      document.getElementById("stat-revenue").innerText = "₹" + totalRevenue.toLocaleString("en-IN");
    }

    function renderTable(orders) {
      const tableBody = document.getElementById("orders-table-body");
      tableBody.innerHTML = "";
      let revenueSum = 0;

      [...orders].reverse().forEach(order => {
        const orderTotal = parsePrice(order.total);
        revenueSum += orderTotal;
        const cleanPhone = String(order.phone || "").replace(/[^0-9]/g, "");
        const whatsappLink = cleanPhone ? `https://wa.me/${cleanPhone.length === 10 ? "91" + cleanPhone : cleanPhone}?text=Hi%20${encodeURIComponent(order.fullName || "")},%20thank%20you%20for%20your%20order%20${encodeURIComponent(order.orderId || "")}%20at%20The%20Mandir%20Company!` : "#";

        tableBody.innerHTML += `
          <tr>
            <td class="ps-4 fw-bold text-dark">${order.orderId || "#"}</td>
            <td class="small text-muted">${order.date || "-"}</td>
            <td class="fw-bold">${order.fullName || "-"}</td>
            <td><a href="tel:${order.phone || ""}" class="text-decoration-none fw-semibold">📞 ${order.phone || "-"}</a></td>
            <td class="small text-secondary" style="max-width: 200px;">${order.address || "-"}</td>
            <td class="small" style="max-width: 220px;">${order.items || "-"}</td>
            <td class="fw-bold text-success">${order.total || "₹0"}</td>
            <td class="pe-4 text-center">
              <a href="${whatsappLink}" target="_blank" class="btn btn-sm btn-outline-success fw-bold">💬 WhatsApp</a>
            </td>
          </tr>
        `;
      });
      updateStats(orders.length, revenueSum);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Admin Order Management | The Mandir Company</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="styles.css"
    rel="stylesheet"
  >

  <style>

    body {
      background-color: #fff6ea;
      margin: 0;
      padding: 0;
    }

    .page-content {
      background-color: #fff6ea;
      min-height: calc(100vh - 120px);
      padding: 40px 0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    label {
      color: #c4a092;
    }

    .order-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }

    /* STATUS */

    .badge-status {
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-block;
      white-space: nowrap;
    }

    .status-pending {
      background-color: #ffeeba;
      color: #856404;
    }

    .status-contacted {
      background-color: #cce5ff;
      color: #004085;
    }

    .status-dispatched {
      background-color: #d4edda;
      color: #155724;
    }

    .status-delivered {
      background-color: #e2eee5;
      color: #55745f;
    }

    /* REFRESH BUTTON */

    .btn-refresh {
      background-color: #c4a092;
      color: white;
      border: none;
      font-weight: 600;
    }

    .btn-refresh:hover {
      background-color: #b08b7d;
      color: white;
    }

    /* TABLE */

    .table-orders {
      vertical-align: middle;
    }

    .table-orders th {
      color: #c4a092;
      background-color: #fffaf3;
      white-space: nowrap;
    }

    .table-orders td {
      vertical-align: middle;
    }

    /* ACTIONS */

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 130px;
    }

    .action-buttons .btn {
      width: 100%;
    }

    /* WHATSAPP */

    .btn-whatsapp {
      color: #6f8977;
      border-color: #8eaa96;
      font-weight: 600;
    }

    .btn-whatsapp:hover {
      background-color: #8eaa96;
      border-color: #8eaa96;
      color: #ffffff;
    }

    /* MARK DELIVERED */

    .btn-delivered {
      background-color: #8eaa96;
      color: #ffffff;
      border: none;
      font-weight: 600;
    }

    .btn-delivered:hover {
      background-color: #7f9c87;
      color: #ffffff;
    }

    .btn-delivered.completed {
      background-color: #e2eee5;
      color: #55745f;
      border: 1px solid #c9dbce;
      cursor: default;
    }

    .btn-delivered.completed:hover {
      background-color: #e2eee5;
      color: #55745f;
    }

    /* DELIVERED ROW */

    .order-delivered {
      background-color: #fcfdfb;
    }

    .order-delivered td {
      opacity: 0.85;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      .page-content {
        padding: 25px 0;
      }

      .order-card {
        padding: 18px;
      }

      .table-orders {
        font-size: 0.88rem;
      }

      .action-buttons {
        min-width: 125px;
      }

    }

  </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-light bg-light">

  <div class="container">

    <a
      class="navbar-brand fw-bold"
      href="index.html"
    >
      The Mandir Company
    </a>

    <span class="navbar-text text-muted fw-bold">
      Admin Dashboard
    </span>

  </div>

</nav>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="page-content">

  <div class="container">

    <!-- PAGE HEADER -->

    <div
      class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3"
    >

      <h2 class="fw-bold m-0">
        Customer Orders 📦
      </h2>

      <button
        class="btn btn-refresh px-4 py-2"
        onclick="fetchOrders()"
      >
        🔄 Refresh Orders
      </button>

    </div>


    <!-- =================================================
         SUMMARY CARDS
    ================================================= -->

    <div class="row g-3 mb-4">

      <!-- TOTAL ORDERS -->

      <div class="col-md-4">

        <div class="order-card text-center py-3">

          <h6 class="text-muted mb-1">
            Total Orders
          </h6>

          <h3
            class="fw-bold m-0"
            id="stat-total"
          >
            0
          </h3>

        </div>

      </div>


      <!-- TOTAL REVENUE -->

      <div class="col-md-4">

        <div class="order-card text-center py-3">

          <h6 class="text-muted mb-1">
            Total Revenue
          </h6>

          <h3
            class="fw-bold m-0"
            id="stat-revenue"
          >
            ₹0
          </h3>

        </div>

      </div>


      <!-- PENDING FOLLOW UPS -->

      <div class="col-md-4">

        <div class="order-card text-center py-3">

          <h6 class="text-muted mb-1">
            Pending Follow-ups
          </h6>

          <h3
            class="fw-bold m-0 text-warning"
            id="stat-pending"
          >
            0
          </h3>

        </div>

      </div>

    </div>


    <!-- =================================================
         ORDERS TABLE
    ================================================= -->

    <div class="order-card p-0 overflow-hidden">

      <div class="table-responsive">

        <table
          class="table table-hover table-orders m-0"
        >

          <thead>

            <tr>

              <th class="ps-4">
                Order ID
              </th>

              <th>
                Date & Time
              </th>

              <th>
                Customer
              </th>

              <th>
                Phone
              </th>

              <th>
                Address
              </th>

              <th>
                Items
              </th>

              <th>
                Total
              </th>

              <th>
                Status
              </th>

              <th class="pe-4 text-center">
                Actions
              </th>

            </tr>

          </thead>


          <tbody id="orders-table-body">

            <tr>

              <td
                colspan="9"
                class="text-center py-5 text-muted"
              >
                Loading orders from Google Sheets...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="text-center py-4 bg-light">

  <p>
    &copy; 2026 The Mandir Company.
    All rights reserved.
  </p>

</footer>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/*
==========================================================
DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
==========================================================
*/

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwf6UpZm6YnLIeyAgz8r4j0YEUOcKqEfXySgL8EUpP7UeMGFw4h__JPJnm-j1zomr67tw/exec";


/*
==========================================================
LOAD ORDERS WHEN PAGE OPENS
==========================================================
*/

document.addEventListener(
  "DOMContentLoaded",
  fetchOrders
);


/*
==========================================================
FETCH ORDERS
==========================================================
*/

async function fetchOrders() {

  const tableBody =
    document.getElementById(
      "orders-table-body"
    );

  tableBody.innerHTML = `

    <tr>

      <td
        colspan="9"
        class="text-center py-5 text-muted"
      >

        <div
          class="spinner-border text-secondary mb-2"
          role="status"
        ></div>

        <div>
          Fetching latest orders...
        </div>

      </td>

    </tr>

  `;


  try {

    const response =
      await fetch(GOOGLE_SCRIPT_URL);

    const orders =
      await response.json();


    /*
    ======================================================
    NO ORDERS
    ======================================================
    */

    if (
      !Array.isArray(orders) ||
      orders.length === 0
    ) {

      tableBody.innerHTML = `

        <tr>

          <td
            colspan="9"
            class="text-center py-5 text-muted"
          >
            No orders found yet.
          </td>

        </tr>

      `;

      updateStats(
        0,
        0
      );

      return;

    }


    /*
    ======================================================
    RENDER ORDERS
    ======================================================
    */

    renderTable(orders);

  }


  catch (error) {

    console.error(
      "Failed to load orders:",
      error
    );


    tableBody.innerHTML = `

      <tr>

        <td
          colspan="9"
          class="text-center py-4 text-danger"
        >

          ⚠️ Unable to fetch orders.

          <br><br>

          Make sure your Google Apps Script
          is correct and deployed as
          <strong>"Anyone"</strong>.

        </td>

      </tr>

    `;

  }

}


/*
==========================================================
PARSE PRICE
==========================================================
*/

function parsePrice(priceStr) {

  if (!priceStr) {
    return 0;
  }

  return parseInt(
    priceStr.replace(
      /[^0-9]/g,
      ''
    )
  ) || 0;

}


/*
==========================================================
UPDATE SUMMARY STATISTICS
==========================================================
*/

function updateStats(
  totalOrders,
  totalRevenue
) {

  document.getElementById(
    "stat-total"
  ).innerText =
    totalOrders;


  document.getElementById(
    "stat-revenue"
  ).innerText =
    "₹" +
    totalRevenue.toLocaleString(
      'en-IN'
    );


  /*
  Count only orders that are
  still visually Pending.
  */

  const pendingOrders =
    document.querySelectorAll(
      "#orders-table-body .status-pending"
    ).length;


  document.getElementById(
    "stat-pending"
  ).innerText =
    pendingOrders;

}


/*
==========================================================
RENDER TABLE
==========================================================
*/

function renderTable(orders) {

  const tableBody =
    document.getElementById(
      "orders-table-body"
    );

  tableBody.innerHTML = "";


  let revenueSum = 0;


  /*
  ========================================================
  REVERSE FOR LATEST ORDERS FIRST
  ========================================================
  */

  orders.reverse().forEach(
    (order, index) => {

      const orderTotalVal =
        parsePrice(
          order.total
        );


      revenueSum +=
        orderTotalVal;


      /*
      ====================================================
      PHONE / WHATSAPP
      ====================================================
      */

      const cleanPhone =
        (order.phone || '')
        .replace(
          /[^0-9]/g,
          ''
        );


      const whatsappLink =
        cleanPhone

          ? `https://wa.me/${
              cleanPhone.length === 10
                ? '91' + cleanPhone
                : cleanPhone
            }?text=Hi%20${encodeURIComponent(
              order.fullName
            )},%20thank%20you%20for%20your%20order%20${encodeURIComponent(
              order.orderId
            )}%20at%20The%20Mandir%20Company!`

          : '#';


      /*
      ====================================================
      CREATE UNIQUE UI ID
      ====================================================
      */

      const safeId =
        "order-row-" + index;


      /*
      ====================================================
      ADD ROW
      ====================================================
      */

      tableBody.innerHTML += `

        <tr
          id="${safeId}"
        >

          <!-- ORDER ID -->

          <td class="ps-4 fw-bold text-dark">

            ${order.orderId || '#'}

          </td>


          <!-- DATE -->

          <td class="small text-muted">

            ${order.date || '-'}

          </td>


          <!-- CUSTOMER -->

          <td class="fw-bold">

            ${order.fullName || '-'}

          </td>


          <!-- PHONE -->

          <td>

            <a
              href="tel:${order.phone || ''}"
              class="text-decoration-none fw-semibold"
            >

              📞 ${order.phone || '-'}

            </a>

          </td>


          <!-- ADDRESS -->

          <td
            class="small text-secondary"
            style="max-width:200px;"
          >

            ${order.address || '-'}

          </td>


          <!-- ITEMS -->

          <td
            class="small"
            style="max-width:220px;"
          >

            ${order.items || '-'}

          </td>


          <!-- TOTAL -->

          <td class="fw-bold text-success">

            ${order.total || '₹0'}

          </td>


          <!-- STATUS -->

          <td>

            <span
              class="badge-status status-pending"
              id="status-${safeId}"
            >
              Pending
            </span>

          </td>


          <!-- ACTIONS -->

          <td class="pe-4 text-center">

            <div class="action-buttons">


              <!-- WHATSAPP -->

              <a
                href="${whatsappLink}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-sm btn-whatsapp"
              >

                💬 WhatsApp

              </a>


              <!-- MARK DELIVERED -->

              <button
                type="button"
                class="btn btn-sm btn-delivered"
                id="deliver-${safeId}"
                onclick="markDelivered('${safeId}')"
              >

                ✓ Mark Delivered

              </button>


            </div>

          </td>

        </tr>

      `;

    }
  );


  /*
  ========================================================
  UPDATE STATS
  ========================================================
  */

  updateStats(
    orders.length,
    revenueSum
  );

}


/*
==========================================================
MARK ORDER AS DELIVERED
==========================================================

IMPORTANT:
This is UI ONLY.

It does NOT send anything to Google Apps Script.
It does NOT modify Google Sheets.

Therefore the status resets to Pending
when the page is refreshed.
==========================================================
*/

function markDelivered(
  orderRowId
) {

  const row =
    document.getElementById(
      orderRowId
    );


  const statusBadge =
    document.getElementById(
      "status-" +
      orderRowId
    );


  const deliveredButton =
    document.getElementById(
      "deliver-" +
      orderRowId
    );


  /*
  ========================================================
  SAFETY CHECK
  ========================================================
  */

  if (
    !row ||
    !statusBadge ||
    !deliveredButton
  ) {

    return;

  }


  /*
  ========================================================
  CHANGE STATUS
  ========================================================
  */

  statusBadge.innerText =
    "Delivered";


  statusBadge.classList.remove(
    "status-pending"
  );


  statusBadge.classList.add(
    "status-delivered"
  );


  /*
  ========================================================
  CHANGE BUTTON
  ========================================================
  */

  deliveredButton.innerText =
    "✓ Delivered";


  deliveredButton.classList.add(
    "completed"
  );


  deliveredButton.disabled =
    true;


  /*
  ========================================================
  STYLE THE ROW
  ========================================================
  */

  row.classList.add(
    "order-delivered"
  );


  /*
  ========================================================
  UPDATE PENDING COUNT
  ========================================================
  */

  const pendingOrders =
    document.querySelectorAll(
      "#orders-table-body .status-pending"
    ).length;


  document.getElementById(
    "stat-pending"
  ).innerText =
    pendingOrders;

}

</script>

</body>
</html>

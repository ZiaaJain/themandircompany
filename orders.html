<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Order Management | The Mandir Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">

  <style>
    body { background-color: #fff6ea; margin: 0; padding: 0; }
    .page-content { background-color: #fff6ea; min-height: calc(100vh - 120px); padding: 40px 0; }
    h1, h2, h3, h4, h5, h6, p, label { color: #c4a092; }
    .order-card { background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
    .badge-status { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; font-weight: 600; }
    .status-pending { background-color: #ffeeba; color: #856404; }
    .status-contacted { background-color: #cce5ff; color: #004085; }
    .status-dispatched { background-color: #d4edda; color: #155724; }
    .btn-refresh { background-color: #c4a092; color: white; border: none; font-weight: 600; }
    .btn-refresh:hover { background-color: #b08b7d; color: white; }
    .table-orders { vertical-align: middle; }
    .table-orders th { color: #c4a092; background-color: #fffaf3; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">The Mandir Company</a>
    <span class="navbar-text text-muted fw-bold">Admin Dashboard</span>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="page-content">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold m-0">Customer Orders 📦</h2>
      <button class="btn btn-refresh px-4 py-2" onclick="fetchOrders()">
        🔄 Refresh Orders
      </button>
    </div>

    <!-- SUMMARY CARDS -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="order-card text-center py-3">
          <h6 class="text-muted mb-1">Total Orders</h6>
          <h3 class="fw-bold m-0" id="stat-total">0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="order-card text-center py-3">
          <h6 class="text-muted mb-1">Total Revenue</h6>
          <h3 class="fw-bold m-0" id="stat-revenue">₹0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="order-card text-center py-3">
          <h6 class="text-muted mb-1">Pending Follow-ups</h6>
          <h3 class="fw-bold m-0 text-warning" id="stat-pending">0</h3>
        </div>
      </div>
    </div>

    <!-- ORDERS TABLE -->
    <div class="order-card p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover table-orders m-0">
          <thead>
            <tr>
              <th class="ps-4">Order ID</th>
              <th>Date & Time</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Address</th>
              <th>Items</th>
              <th>Total</th>
              <th class="pe-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <tr>
              <td colspan="8" class="text-center py-5 text-muted">
                Loading orders from Google Sheets...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="text-center py-4 bg-light">
  <p>&copy; 2026 The Mandir Company. All rights reserved.</p>
</footer>

<script>
// Deployed Google Apps Script Web App URL:
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxX8gxiaq7S5uPuGlorRhNMPXSBTiaHiqm-uWK8J7hriVH1vTJL6J8KM8wQkoHLjq-Msw/exec";

document.addEventListener("DOMContentLoaded", fetchOrders);

async function fetchOrders() {
  const tableBody = document.getElementById("orders-table-body");
  tableBody.innerHTML = `
    <tr>
      <td colspan="8" class="text-center py-5 text-muted">
        <div class="spinner-border text-secondary mb-2" role="status"></div>
        <div>Fetching latest orders...</div>
      </td>
    </tr>
  `;

  try {
    const response = await fetch(GOOGLE_SCRIPT_URL);
    const orders = await response.json();

    if (!Array.isArray(orders) || orders.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-5 text-muted">
            No orders found yet.
          </td>
        </tr>
      `;
      updateStats(0, 0);
      return;
    }

    renderTable(orders);
  } catch (error) {
    console.error("Failed to load orders:", error);
    tableBody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center py-4 text-danger">
          ⚠️ Unable to fetch orders. Make sure your <code>"https://script.google.com/macros/s/AKfycbxX8gxiaq7S5uPuGlorRhNMPXSBTiaHiqm-uWK8J7hriVH1vTJL6J8KM8wQkoHLjq-Msw/exec";
</code> is correct and deployed as "Anyone".
        </td>
      </tr>
    `;
  }
}

function parsePrice(priceStr) {
  if (!priceStr) return 0;
  return parseInt(priceStr.replace(/[^0-9]/g, '')) || 0;
}

function updateStats(totalOrders, totalRevenue) {
  document.getElementById("stat-total").innerText = totalOrders;
  document.getElementById("stat-revenue").innerText = "₹" + totalRevenue.toLocaleString('en-IN');
  document.getElementById("stat-pending").innerText = totalOrders;
}

function renderTable(orders) {
  const tableBody = document.getElementById("orders-table-body");
  tableBody.innerHTML = "";

  let revenueSum = 0;

  orders.reverse().forEach(order => {
    const orderTotalVal = parsePrice(order.total);
    revenueSum += orderTotalVal;

    const cleanPhone = (order.phone || '').replace(/[^0-9]/g, '');
    const whatsappLink = cleanPhone ? `https://wa.me/${cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone}?text=Hi%20${encodeURIComponent(order.fullName)},%20thank%20you%20for%20your%20order%20${encodeURIComponent(order.orderId)}%20at%20The%20Mandir%20Company!` : '#';

    tableBody.innerHTML += `
      <tr>
        <td class="ps-4 fw-bold text-dark">${order.orderId || '#'}</td>
        <td class="small text-muted">${order.date || '-'}</td>
        <td class="fw-bold">${order.fullName || '-'}</td>
        <td>
          <a href="tel:${order.phone}" class="text-decoration-none fw-semibold">
            📞 ${order.phone || '-'}
          </a>
        </td>
        <td class="small text-secondary" style="max-width: 200px;">${order.address || '-'}</td>
        <td class="small" style="max-width: 220px;">${order.items || '-'}</td>
        <td class="fw-bold text-success">${order.total || '₹0'}</td>
        <td class="pe-4 text-center">
          <a href="${whatsappLink}" target="_blank" class="btn btn-sm btn-outline-success fw-bold">
            💬 WhatsApp
          </a>
        </td>
      </tr>
    `;
  });

  updateStats(orders.length, revenueSum);
}
</script>

</body>
</html>

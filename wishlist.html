<!DOCTYPE html>
<html lang="en">
<head>

  <link href="styles.css" rel="stylesheet">

  <style>
    :root {
      --brand-bg: #fff6ea;
      --brand-nav: #f8f9fa;
      --brand: #c4a092;
      --brand-hover: #a37d6f;
      --soft-border: rgba(196, 160, 146, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      background-color: var(--brand-bg);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       NAVBAR
    ========================= */

    .custom-navbar {
      background-color: var(--brand-nav) !important;
      border-bottom: 1px solid rgba(196, 160, 146, 0.12);
    }

    .custom-navbar .container {
      min-height: 64px;
    }

    .custom-navbar .navbar-brand,
    .custom-navbar .nav-link {
      color: var(--brand) !important;
      font-weight: 400 !important;
    }

    .custom-navbar .navbar-brand {
      letter-spacing: 0.01em;
    }

    .custom-navbar .nav-link {
      padding: 0.65rem 0.75rem !important;
      transition: color 0.2s ease;
    }

    .custom-navbar .nav-link:hover,
    .custom-navbar .nav-link:focus {
      color: var(--brand-hover) !important;
    }

    .custom-navbar .navbar-toggler {
      border-color: var(--brand);
      padding: 0.4rem 0.55rem;
    }

    .custom-navbar .navbar-toggler:focus {
      box-shadow: 0 0 0 0.15rem rgba(196, 160, 146, 0.2);
    }

    .custom-navbar .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='%23c4a092' stroke-width='1.5' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* =========================
       PAGE
    ========================= */

    .page-content {
      background-color: var(--brand-bg);
      flex: 1;
      padding: clamp(30px, 5vw, 60px) 0;
    }

    .wishlist-section {
      width: 100%;
    }

    .wishlist-title {
      color: var(--brand);
      font-size: clamp(1.55rem, 3vw, 2rem);
      font-weight: 400 !important;
      letter-spacing: 0.03em;
      margin-bottom: 1.8rem;
      position: relative;
    }

    .wishlist-title::after {
      content: "";
      display: block;
      width: 42px;
      height: 1px;
      background-color: var(--brand);
      margin: 12px auto 0;
      opacity: 0.65;
    }

    /* =========================
       SHARE BUTTON
    ========================= */

    .share-wrapper {
      margin-bottom: 2rem;
    }

    .btn-share {
      color: var(--brand);
      border: 1px solid var(--brand);
      background: transparent;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 400;
      transition: all 0.2s ease;
    }

    .btn-share:hover,
    .btn-share:focus {
      background-color: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    /* =========================
       WISHLIST GRID
    ========================= */

    #wishlist-container {
      row-gap: 24px;
    }

    .wishlist-item {
      display: flex;
    }

    .wishlist-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--soft-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      overflow: hidden;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .wishlist-card:hover {
      transform: translateY(-3px);
      border-color: rgba(196, 160, 146, 0.38);
      box-shadow: 0 8px 24px rgba(80, 55, 45, 0.08);
    }

    .wishlist-product-link {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .wishlist-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #fffaf4;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .wishlist-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
      display: block;
      transition: transform 0.25s ease;
    }

    .wishlist-card:hover img {
      transform: scale(1.025);
    }

    .wishlist-card h6 {
      color: var(--brand);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      min-height: 2.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0 4px 7px;
    }

    .wishlist-card p {
      color: var(--brand);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      margin: 0 0 14px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .wishlist-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-move-cart,
    .btn-remove {
      width: 100%;
      min-height: 40px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      transition: all 0.2s ease;

    .btn-move-cart {
      background-color: var(--brand);
      color: white;
      border: 1px solid var(--brand);
    }

    .btn-move-cart:hover,
    .btn-move-cart:focus {
      background-color: var(--brand-hover);
      border-color: var(--brand-hover);
      color: white;
    }

    .btn-remove {
      background-color: transparent;
      color: #dc3545;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .btn-remove:hover,
    .btn-remove:focus {
      background-color: #dc3545;
      border-color: #dc3545;
      color: white;
    }

    .btn-move-cart:focus-visible,
    .btn-remove:focus-visible,
    .btn-share:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* =========================
       EMPTY WISHLIST
    ========================= */

    .empty-wishlist-box {
      max-width: 620px;
      margin: 10px auto 0;
      background: #ffffff;
      border: 1px solid var(--soft-border);
      border-radius: 18px;

      box-shadow: 0 6px 22px rgba(80, 55, 45, 0.05);

    .btn-explore {

      font-weight: 500;

// RENDER WISHLIST ITEMS
function displayWishlist() {
  const container = document.getElementById("wishlist-container");
  const emptyWrapper = document.getElementById("empty-wishlist-wrapper");
  const shareContainer = document.getElementById("share-container");

  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  wishlist = wishlist.map(String);

  container.innerHTML = "";

  if (wishlist.length === 0) {
    emptyWrapper.style.display = "block";
    shareContainer.style.display = "none";
    return;
  }

  emptyWrapper.style.display = "none";
  shareContainer.style.display = "block";

  wishlist.forEach(id => {
    if (products[id]) {
      const item = products[id];

      const cardHtml = `
        <div class="col-6 col-md-4 col-lg-3 wishlist-item" id="item-${id}">
          <div class="wishlist-card text-center">

            <a
              href="product.html?id=${id}"
              class="wishlist-product-link"
            >
              <div class="wishlist-image-wrapper">
                <img
                  src="${item.img}"
                  alt="${item.name}"
                  loading="lazy"
                >
              </div>

              <h6>${item.name}</h6>
              <p>${item.price}</p>
            </a>

            <div class="wishlist-actions">

              <button
                class="btn btn-move-cart"
                onclick="moveToCart('${id}')"
              >
                Move to Cart 🛒
              </button>

              <button
                class="btn btn-remove"
                onclick="removeFromWishlist('${id}')"
              >
                Remove 🗑️
              </button>

            </div>

          </div>
        </div>
      `;

      container.innerHTML += cardHtml;
    }
  });
}


// MOVE ITEM FROM WISHLIST TO CART
function moveToCart(id) {
  let rawCart = localStorage.getItem("cart");
  let cartObj = {};

  if (rawCart) {
    try {
      let parsed = JSON.parse(rawCart);

      if (Array.isArray(parsed)) {
        parsed.forEach(itemId => {
          cartObj[String(itemId)] = 1;
        });
      } else {
        cartObj = parsed;
      }

    } catch (e) {
      cartObj = {};
    }
  }

  // Increment quantity if item is already in cart, otherwise set to 1
  cartObj[String(id)] = (parseInt(cartObj[String(id)]) || 0) + 1;

  localStorage.setItem("cart", JSON.stringify(cartObj));

  // Remove from Wishlist
  removeFromWishlist(id);
}


// REMOVE ITEM FROM WISHLIST
function removeFromWishlist(id) {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  wishlist = wishlist.filter(
    item => String(item) !== String(id)
  );

  localStorage.setItem("wishlist", JSON.stringify(wishlist));

  displayWishlist();
}


// SHARE WISHLIST FUNCTIONALITY WITH PRODUCT LINKS
function shareWishlist() {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  if (wishlist.length === 0) {
    alert("Your wishlist is empty!");
    return;
  }

  const baseUrl =
    window.location.origin +
    window.location.pathname.replace(
      "wishlist.html",
      "product.html"
    );

  let shareText =
    "Check out my wishlist from The Mandir Company:\n\n";

  shareText += wishlist
    .filter(id => products[id])
    .map(
      id =>
        `• ${products[id].name}\nLink: ${baseUrl}?id=${id}`
    )
    .join("\n\n");

  if (navigator.share) {

    navigator.share({
      title: "My Wishlist | The Mandir Company",
      text: shareText,
    }).catch(console.error);

  } else {

    navigator.clipboard.writeText(shareText);

    alert(
      "Wishlist items and links copied to clipboard!"
    );
  }
}


// INITIALIZE ON LOAD
document.addEventListener(
  "DOMContentLoaded",

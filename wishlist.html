// RENDER WISHLIST ITEMS
function displayWishlist() {
  const container = document.getElementById("wishlist-container");
  const emptyMsg = document.getElementById("empty-msg");
  const shareContainer = document.getElementById("share-container");
  
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  
  // Clean string conversion comparison
  wishlist = wishlist.map(String);

  container.innerHTML = "";

  if (wishlist.length === 0) {
    emptyMsg.innerText = "Your wishlist is empty!";
    shareContainer.style.display = "none"; // Hide share button when empty
    return;
  } else {
    emptyMsg.innerText = "";
    shareContainer.style.display = "block"; // Show share button when items exist
  }

  wishlist.forEach(id => {
    if (products[id]) {
      const item = products[id];
      const cardHtml = `
        <div class="col-6 col-md-4 col-lg-3 mb-4" id="item-${id}">
          <div class="wishlist-card text-center">
            <a href="product.html?id=${id}" class="text-decoration-none">
              <img src="${item.img}" alt="${item.name}">
              <h6>${item.name}</h6>
              <p>${item.price}</p>
            </a>
            <button class="btn btn-sm btn-outline-danger mt-2" onclick="removeFromWishlist('${id}')">Remove 🗑️</button>
          </div>
        </div>
      `;
      container.innerHTML += cardHtml;
    }
  });
}

// REMOVE ITEM FROM WISHLIST
function removeFromWishlist(id) {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  wishlist = wishlist.filter(item => String(item) !== String(id));
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  displayWishlist();
}

// SHARE WISHLIST FUNCTIONALITY WITH PRODUCT LINKS
function shareWishlist() {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  if (wishlist.length === 0) {
    alert("Your wishlist is empty!");
    return;
  }

  // Base URL calculation (gets current domain/path automatically)
  const baseUrl = window.location.origin + window.location.pathname.replace("wishlist.html", "product.html");

  // Construct message with Item Name + Link
  let shareText = "Check out my wishlist from The Mandir Company:\n\n";
  shareText += wishlist
    .filter(id => products[id])
    .map(id => `• ${products[id].name}\nLink: ${baseUrl}?id=${id}`)
    .join("\n\n");

  if (navigator.share) {
    navigator.share({
      title: 'My Wishlist | The Mandir Company',
      text: shareText,
    }).catch(console.error);
  } else {
    navigator.clipboard.writeText(shareText);
    alert("Wishlist items and links copied to clipboard!");
  }
}

// INITIALIZE ON LOAD
document.addEventListener("DOMContentLoaded", displayWishlist);

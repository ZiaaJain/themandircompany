<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Wishlist | The Mandir Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #fff6ea; color: #80655c; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    .custom-navbar { background-color: #f8f9fa !important; border-bottom: 1px solid rgba(196, 160, 146, 0.12); }
    .custom-navbar .navbar-brand, .custom-navbar .nav-link { color: #c4a092 !important; }
    .page-content { min-height: calc(100vh - 180px); padding: 45px 15px 70px; }
    h1, h2, h3, h4, h5, h6, p { color: #c4a092; }
    .wishlist-card { background: #ffffff; border-radius: 16px; padding: 12px; height: 100%; display: flex; flex-direction: column; box-shadow: 0 4px 18px rgba(196,160,146,0.10); }
    .wishlist-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; }
    .btn-move-cart { background-color: #c4a092; color: white; border: none; border-radius: 8px; padding: 8px 12px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">The Mandir Company</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="bestsellers.html">Bestsellers</a></li>
        <li class="nav-item"><a class="nav-link active" href="wishlist.html">Wishlist</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page-content container">
  <div class="text-center mb-4">
    <h1>My Wishlist ♡</h1>
    <div id="wishlist-count" class="text-muted">0 items saved</div>
  </div>

  <div id="wishlist-container" class="row g-3">Loading wishlist...</div>
</main>

<footer class="text-center py-4 bg-light"><p>&copy; 2026 The Mandir Company. All rights reserved.</p></footer>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnJU4J23D0TRxGyUauR77R3wMNeEEwYB8KEaKhb6el5DPIH5-7x8Y7XwEBV2NRVwZV3g/exec";
let products = {};

async function displayWishlist() {
  const container = document.getElementById("wishlist-container");
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getProducts");
    const list = await res.json();
    list.forEach(p => products[p.id] = p);

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    wishlist = wishlist.map(String).filter(id => products[id]);

    document.getElementById("wishlist-count").textContent = `${wishlist.length} item(s) saved`;

    if (wishlist.length === 0) {
      container.innerHTML = `<div class="text-center w-100 py-5"><h3>Your Wishlist is Empty</h3><a href="bestsellers.html" class="btn btn-outline-secondary mt-2">Explore Catalog</a></div>`;
      return;
    }

    container.innerHTML = "";
    wishlist.forEach(id => {
      const item = products[id];
      container.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="wishlist-card">
            <a href="product.html?id=${id}"><img src="${item.img}" alt="${item.name}"></a>
            <h6 class="mt-2 mb-1 fw-bold">${item.name}</h6>
            <div class="fw-bold mb-2" style="color:#a37d6f;">${item.price}</div>
            <button class="btn btn-move-cart w-100 mt-auto" onclick="moveToCart('${id}')">Add to Cart 🛒</button>
          </div>
        </div>`;
    });
  } catch(e) {
    console.error("Wishlist error", e);
  }
}

function moveToCart(id) {
  let cartObj = JSON.parse(localStorage.getItem("cart")) || {};
  cartObj[String(id)] = (parseInt(cartObj[String(id)]) || 0) + 1;
  localStorage.setItem("cart", JSON.stringify(cartObj));
  alert("Added to cart!");
}

document.addEventListener("DOMContentLoaded", displayWishlist);
</script>
</body>
</html>

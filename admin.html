<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mandir Company - Accounts Admin</title>

  <!-- Google Fonts: Elegant Playfair Display & Modern Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #fff6ea;
      margin: 0;
      padding: 30px 20px;
      color: #444;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #c4a092;
      font-size: 32px;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #c4a092;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(196, 160, 146, 0.3);
    }

    .refresh-btn:hover {
      background: #b08b7d;
      transform: translateY(-1px);
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px 20px;
      border-radius: 14px;
      border: 1px solid rgba(196, 160, 146, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .card h3 {
      margin: 0 0 8px 0;
      color: #888;
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card .value {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #333;
    }

    .table-container {
      background: white;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(196, 160, 146, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      overflow-x: auto;
    }

    .controls {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2d7d0;
      border-radius: 10px;
      font-size: 14px;
      background-color: #fffaf3;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: #c4a092;
      box-shadow: 0 0 0 3px rgba(196, 160, 146, 0.15);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #fffaf3;
      color: #c4a092;
      font-weight: 700;
      padding: 14px 16px;
      border-bottom: 2px solid #f0e6df;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.6px;
    }

    th:first-child { border-top-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f7f1eb;
      color: #555;
    }

    tr:hover td {
      background-color: #fffcf8;
    }

    .badge-margin {
      background: #eaf6ed;
      color: #2b7a41;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Accounts & Sales</h1>
      <button class="refresh-btn" onclick="fetchAccountsData()">🔄 Refresh</button>
    </div>

    <div class="stats-container">
      <div class="card">
        <h3>Total Sales</h3>
        <div class="value" id="stat-sales">₹0</div>
      </div>
      <div class="card">
        <h3>Total Cost</h3>
        <div class="value" id="stat-cost">₹0</div>
      </div>
      <div class="card">
        <h3>Gross Margin</h3>
        <div class="value" id="stat-margin">₹0</div>
      </div>
      <div class="card">
        <h3>Items Sold</h3>
        <div class="value" id="stat-items">0</div>
      </div>
    </div>

    <div class="table-container">
      <div class="controls">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search customer, item, or date...">
      </div>

      <div id="loading" class="loading">Loading accounts data...</div>

      <table id="accountsTable" style="display:none;">
        <thead>
          <tr>
            <th>Qty</th>
            <th>Name (Item)</th>
            <th>Cost</th>
            <th>Selling Price</th>
            <th>Gross Margin</th>
            <th>Customer</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcQZiECrXYNcBdUr8YTiLLMJoPMDxWVXql-n9K86cFczN-770M2Ci_B9BdPonpOuhsWA/exec";

    let rawData = [];

    // JSONP Loader to bypass CORS issues on GitHub Pages
    function fetchAccountsData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').innerText = 'Loading accounts data...';
      document.getElementById('accountsTable').style.display = 'none';

      // Remove any existing JSONP script tag
      const existingScript = document.getElementById('jsonp-script');
      if (existingScript) existingScript.remove();

      // Create new JSONP script request
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${WEB_APP_URL}?callback=handleResponse`;
      
      script.onerror = function() {
        document.getElementById('loading').innerText = 'Failed to load data. Please check your Web App URL.';
      };

      document.body.appendChild(script);
    }

    // JSONP Callback Handler
    function handleResponse(data) {
      if (Array.isArray(data)) {
        rawData = data;
        renderDashboard(rawData);
      } else {
        document.getElementById('loading').innerText = 'Error loading data from sheet.';
      }
    }

    function renderDashboard(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let totalSales = 0;
      let totalCost = 0;
      let totalMargin = 0;
      let totalItems = 0;

      data.forEach(row => {
        // Clean numeric formatting (removes commas, currency symbols)
        const parseNum = (str) => parseFloat(String(str || '0').replace(/[^0-9.-]+/g, "")) || 0;

        const qty = parseNum(row.quantity) || 1;
        const cost = parseNum(row.cost);
        const price = parseNum(row.sellingPrice);
        const margin = parseNum(row.grossMargin) || (price - cost);

        totalSales += price;
        totalCost += cost;
        totalMargin += margin;
        totalItems += qty;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.quantity || 1}</td>
          <td><strong style="color:#333;">${row.name}</strong></td>
          <td>₹${cost.toLocaleString('en-IN')}</td>
          <td>₹${price.toLocaleString('en-IN')}</td>
          <td><span class="badge-margin">₹${margin.toLocaleString('en-IN')}</span></td>
          <td>${row.customer}</td>
          <td>${row.date}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('stat-sales').innerText = '₹' + totalSales.toLocaleString('en-IN');
      document.getElementById('stat-cost').innerText = '₹' + totalCost.toLocaleString('en-IN');
      document.getElementById('stat-margin').innerText = '₹' + totalMargin.toLocaleString('en-IN');
      document.getElementById('stat-items').innerText = totalItems;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('accountsTable').style.display = 'table';
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(item => 
        (item.name && item.name.toLowerCase().includes(input)) ||
        (item.customer && item.customer.toLowerCase().includes(input)) ||
        (item.date && item.date.toLowerCase().includes(input))
      );
      renderDashboard(filtered);
    }

    // Auto load on page start
    fetchAccountsData();
  </script>
</body>
</html>

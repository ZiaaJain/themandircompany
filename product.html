<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product | The Mandir Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5.3.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="styles.css" rel="stylesheet">

  <style>

    /* =========================
       PAGE
    ========================= */

    body {
      background-color: #fff6ea;
      margin: 0;
      padding: 0;
    }

    .page-content {
      background-color: #fff6ea;
      min-height: calc(100vh - 120px);
      padding: 55px 0 75px;
    }


    /* =========================
       NAVBAR — SAME AS ABOUT
    ========================= */

    .custom-navbar {
      background-color: #f8f9fa !important;
    }

    .custom-navbar .navbar-brand,
    .custom-navbar .nav-link {
      color: #c4a092 !important;
      font-weight: 400 !important;
    }

    .custom-navbar .nav-link:hover {
      color: #a37d6f !important;
    }

    .custom-navbar .navbar-brand {
      letter-spacing: 0.2px;
    }

    .custom-navbar .navbar-toggler {
      border-color: #c4a092;
    }

    .custom-navbar .navbar-toggler:focus {
      box-shadow: 0 0 0 0.15rem rgba(196, 160, 146, 0.25);
    }

    .custom-navbar .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='%23c4a092' stroke-width='1.5' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* Product-page navbar badge */

    .cart-badge {
      background-color: #c4a092 !important;
      color: #fff !important;
      font-size: 0.7rem;
      padding: 4px 7px;
      border-radius: 50px;
      vertical-align: middle;
    }


    /* =========================
       BREADCRUMB
    ========================= */

    .product-breadcrumb {
      font-size: 0.85rem;
      margin-bottom: 30px;
      color: #c4a092;
    }

    .product-breadcrumb a {
      color: #c4a092;
      text-decoration: none;
    }

    .product-breadcrumb a:hover {
      color: #a37d6f;
    }


    /* =========================
       PRODUCT IMAGE
    ========================= */

    .product-image-wrapper {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(196, 160, 146, 0.12);
      max-width: 540px;
      margin: auto;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      display: block;
      border-radius: 10px;
    }


    /* =========================
       PRODUCT DETAILS
    ========================= */

    .product-details {
      padding: 15px 10px;
    }

    .product-name {
      color: #c4a092;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .product-price {
      color: #c4a092;
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .product-divider {
      width: 55px;
      height: 2px;
      background-color: #c4a092;
      margin-bottom: 25px;
    }

    .product-description {
      color: #c4a092;
      font-size: 1rem;
      line-height: 1.8;
      margin-top: 25px;
    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity-label {
      color: #c4a092;
      font-weight: 600;
      margin-right: 8px;
    }

    .quantity-selector {
      display: inline-flex;
      align-items: center;
      border: 1px solid #c4a092;
      border-radius: 8px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .qty-btn {
      border: 0;
      color: #c4a092;
      background: #ffffff;
      font-weight: 600;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .qty-btn:hover {
      background-color: #fff6ea;
    }

    .qty-input {
      width: 45px;
      height: 42px;
      text-align: center;
      border: 0;
      border-left: 1px solid #c4a092;
      border-right: 1px solid #c4a092;
      font-weight: 600;
      color: #c4a092;
      background-color: #ffffff;
    }


    /* =========================
       BUTTONS
    ========================= */

    .product-actions {
      margin-top: 25px;
    }

    .btn-custom-cart {
      background-color: #c4a092;
      color: white;
      border: 1px solid #c4a092;
      border-radius: 7px;
      min-height: 46px;
      transition: all 0.25s ease;
    }

    .btn-custom-cart:hover {
      background-color: #b08b7d;
      color: white;
      transform: translateY(-1px);
    }

    .wishlist-button {
      border: 1px solid #c4a092;
      color: #c4a092;
      background-color: transparent;
      border-radius: 7px;
      min-height: 46px;
      transition: all 0.25s ease;
    }

    .wishlist-button:hover {
      background-color: #fff;
      color: #a37d6f;
      border-color: #a37d6f;
    }

    .btn-remove-cart {
      background-color: #FF8E88;
      color: white;
      border: 1px solid #FF8E88;
      border-radius: 7px;
      min-height: 46px;
    }

    .btn-remove-cart:hover {
      background-color: #FF8E88;
      color: white;
      border-color: #FF8E88;
    }


    /* =========================
       STATUS MESSAGE
    ========================= */

    .status-msg {
      color: #c4a092;
      font-weight: 500;
      font-size: 0.95rem;
      min-height: 24px;
      margin-top: 15px;
    }


    /* =========================
       PRODUCT BENEFITS
    ========================= */

    .product-benefits {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid rgba(196, 160, 146, 0.25);
    }

    .benefit {
      color: #c4a092;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background-color: #f8f9fa !important;
    }

    footer p {
      color: #c4a092;
      margin: 0;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 767px) {

      .page-content {
        padding: 35px 15px 55px;
      }

      .product-breadcrumb {
        margin-bottom: 20px;
      }

      .product-image-wrapper {
        padding: 15px;
        border-radius: 12px;
      }

      .product-details {
        padding: 30px 5px 0;
      }

      .product-name {
        font-size: 2rem;
      }

      .product-price {
        font-size: 1.5rem;
      }

      .product-actions .btn {
        width: 100%;
      }

    }

  </style>
</head>

<body>


<!-- =====================================================
     NAVBAR
     SAME STYLE AS ABOUT.HTML
===================================================== -->

<nav class="navbar navbar-expand-lg custom-navbar">

  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="index.html">

      <img
        src="images/The Mandir Company.jpeg"
        alt="The Mandir Company Logo"
        width="40"
        height="40"
        class="d-inline-block align-text-top me-2"
        style="object-fit: contain;"
      >

      The Mandir Company

    </a>


    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >

      <span class="navbar-toggler-icon"></span>

    </button>


    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="bestsellers.html">
            ← Back to Bestsellers
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="wishlist.html">
            Wishlist ❤️
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-bold" href="cart.html">
            Cart 🛒
            <span
              id="cart-count-badge"
              class="badge cart-badge"
            >0</span>
          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<!-- =====================================================
     MAIN PRODUCT CONTENT
===================================================== -->

<div class="page-content">

  <section class="container">

    <!-- BREADCRUMB -->

    <div class="product-breadcrumb">

      <a href="bestsellers.html">Bestsellers</a>

      <span class="mx-2">›</span>

      <span>Product</span>

    </div>


    <div class="row align-items-center g-5">


      <!-- =================================================
           PRODUCT IMAGE
      ================================================= -->

      <div class="col-md-6 text-center">

        <div class="product-image-wrapper">

          <img
            id="product-image"
            src="https://via.placeholder.com/500"
            alt="Product image"
            class="product-img"
          >

        </div>

      </div>


      <!-- =================================================
           PRODUCT DETAILS
      ================================================= -->

      <div class="col-md-6">

        <div class="product-details">

          <h1
            id="product-name"
            class="product-name"
          ></h1>


          <h3
            id="product-price"
            class="product-price"
          ></h3>


          <div class="product-divider"></div>


          <!-- QUANTITY -->

          <div class="d-flex align-items-center mb-3">

            <span class="quantity-label">
              Quantity
            </span>

            <div class="quantity-selector">

              <button
                class="qty-btn"
                onclick="adjustQty(-1)"
                aria-label="Decrease quantity"
              >
                −
              </button>

              <input
                type="text"
                id="qty-count"
                class="qty-input"
                value="1"
                readonly
                aria-label="Quantity"
              >

              <button
                class="qty-btn"
                onclick="adjustQty(1)"
                aria-label="Increase quantity"
              >
                +
              </button>

            </div>

          </div>


          <!-- ACTION BUTTONS -->

          <div class="product-actions">

            <div class="d-flex flex-wrap gap-2">

              <button
                id="cart-btn"
                class="btn btn-custom-cart px-4"
                onclick="toggleCart()"
              >
                🛒 Add to Cart
              </button>


              <button
                id="wishlist-btn"
                class="btn wishlist-button px-4"
                onclick="toggleWishlist()"
              >
                🤍 Add to Wishlist
              </button>

            </div>

          </div>


          <!-- STATUS -->

          <p
            id="action-msg"
            class="status-msg"
            aria-live="polite"
          ></p>


          <!-- DESCRIPTION -->

          <p
            id="product-description"
            class="product-description"
          ></p>


          <!-- BENEFITS -->

          <div class="product-benefits">

            <div class="benefit">
              ✦ Thoughtfully curated for your sacred space
            </div>

            <div class="benefit">
              ✦ Perfect for gifting and festive occasions
            </div>

            <div class="benefit">
              ✦ Elegant pieces for the modern Indian home
            </div>

          </div>

        </div>

      </div>

    </div>

  </section>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="text-center py-4 bg-light">

  <p>
    &copy; 2026 The Mandir Company. All rights reserved.
  </p>

</footer>


<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product | The Mandir Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body { background-color: #fff6ea; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    .custom-navbar { background-color: #f8f9fa !important; border-bottom: 1px solid rgba(196, 160, 146, 0.12); }
    .custom-navbar .navbar-brand, .custom-navbar .nav-link { color: #c4a092 !important; }
    .page-content { background-color: #fff6ea; min-height: calc(100vh - 120px); padding: 70px 0 90px; }
    .product-showcase { background: rgba(255,255,255,0.72); border-radius: 24px; padding: 35px; box-shadow: 0 10px 35px rgba(120, 85, 65, 0.08); }
    .product-image-area { background: #ffffff; border-radius: 20px; padding: 25px; min-height: 450px; display: flex; align-items: center; justify-content: center; }
    .product-img { width: 100%; max-width: 450px; height: auto; aspect-ratio: 1 / 1; object-fit: contain; border-radius: 14px; }
    h1, h2, h3, h6, p, label { color: #c4a092; }
    #product-price { font-size: 1.65rem; color: #a37d6f; }
    .btn-custom-cart { background-color: #c4a092; color: white; border-radius: 7px; padding: 12px 25px !important; border: none; }
    .btn-custom-cart:hover { background-color: #b08b7d; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/The Mandir Company.jpeg" alt="Logo" width="40" height="40" class="me-2" style="object-fit: contain;">
      The Mandir Company
    </a>
    <ul class="navbar-nav ms-auto flex-row gap-3">
      <li class="nav-item"><a class="nav-link" href="bestsellers.html">← Bestsellers</a></li>
      <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist ❤️</a></li>
      <li class="nav-item"><a class="nav-link fw-bold" href="cart.html">Cart 🛒 <span id="cart-count-badge" class="badge bg-secondary">0</span></a></li>
    </ul>
  </div>
</nav>

<div class="page-content">
  <section class="container" style="max-width: 1180px;">
    <div class="product-showcase">
      <div class="row align-items-center g-lg-4">
        <div class="col-lg-6">
          <div class="product-image-area">
            <img id="product-image" src="https://via.placeholder.com/500?text=Loading..." alt="Product image" class="product-img">
          </div>
        </div>
        <div class="col-lg-6">
          <div style="padding: 10px;">
            <div style="color: #c4a092; letter-spacing: 2px; text-transform: uppercase;" class="small mb-2">The Mandir Company</div>
            <h1 id="product-name" class="fw-bold">Loading...</h1>
            <h3 id="product-price" class="fw-bold mb-3"></h3>
            <p id="product-description" class="fs-5 mb-4"></p>
            
            <div class="d-flex gap-2 mb-3">
              <button id="cart-btn" class="btn btn-custom-cart" onclick="toggleCart()">🛒 Add to Cart</button>
              <button id="wishlist-btn" class="btn btn-outline-secondary" onclick="toggleWishlist()">🤍 Add to Wishlist</button>
            </div>
            <p id="action-msg" class="fw-bold text-success"></p>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<footer class="text-center py-4 bg-light"><p>&copy; 2026 The Mandir Company. All rights reserved.</p></footer>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnJU4J23D0TRxGyUauR77R3wMNeEEwYB8KEaKhb6el5DPIH5-7x8Y7XwEBV2NRVwZV3g/exec";
let products = {};
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function initProductPage() {
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getProducts");
    const list = await res.json();
    list.forEach(p => products[p.id] = p);

    if (products[id]) {
      document.getElementById("product-name").innerText = products[id].name;
      document.getElementById("product-price").innerText = products[id].price;
      document.getElementById("product-description").innerText = products[id].desc;
      document.getElementById("product-image").src = products[id].img;
    } else {
      document.getElementById("product-name").innerText = "Product Not Found";
    }
  } catch(e) {
    console.error("Error loading product detail", e);
  }
}

function getCart() {
  try { return JSON.parse(localStorage.getItem("cart")) || {}; } catch(e) { return {}; }
}

function toggleCart() {
  let cartObj = getCart();
  if (cartObj[String(id)]) delete cartObj[String(id)];
  else cartObj[String(id)] = 1;
  localStorage.setItem("cart", JSON.stringify(cartObj));
  document.getElementById("action-msg").innerText = cartObj[String(id)] ? "Added to Cart! 🛒" : "Removed from Cart!";
}

function toggleWishlist() {
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  if (wishlist.map(String).includes(String(id))) {
    wishlist = wishlist.filter(item => String(item) !== String(id));
  } else {
    wishlist.push(String(id));
  }
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  document.getElementById("action-msg").innerText = "Wishlist updated!";
}

document.addEventListener("DOMContentLoaded", initProductPage);
</script>
</body>
</html>
